# Tests, lint and build on every push and pull request
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # cancel superseded PR runs, but never runs on main (every pushed commit gets a full CI)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Formatting (ruff format)
        run: ruff format --check .
      - name: Tests (pytest)
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # --ignore-scripts: no package install hooks run in CI (none are needed)
      - run: npm ci --ignore-scripts
      - name: Lint (ESLint)
        run: npm run lint
      - name: Formatting (Prettier)
        run: npm run format:check
      - name: Tests (Vitest)
        run: npm test
      - name: Build (Vite)
        run: npm run build

  licenses:
    # dependency licenses compatible with MIT + no foreign copyright headers in our code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Lint CI scripts
        run: ruff check --config backend/pyproject.toml .github/scripts && ruff format --check --config backend/pyproject.toml .github/scripts
      - name: Test CI scripts
        run: pytest -p no:cacheprovider .github/scripts
      - name: Copyright and licenses
        run: python .github/scripts/check_licenses.py
      - name: No invisible/bidirectional characters (Trojan Source)
        run: python .github/scripts/check_unicode.py

  dependency-review:
    # PRs only: newly added dependencies — license from the allow list and no serious vulnerabilities
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          allow-licenses: >-
            MIT, MIT-0, ISC, 0BSD, BSD-2-Clause, BSD-3-Clause, Apache-2.0, PSF-2.0,
            Zlib, CC0-1.0, Unlicense, BlueOak-1.0.0, MPL-2.0
          # browser-support data used only by the build tool (same rule as check_licenses.py)
          allow-dependencies-licenses: pkg:npm/caniuse-lite

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build images
        run: docker compose build --pull backend frontend
