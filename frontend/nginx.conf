server {
  # nginx-unprivileged: runs without root, so port > 1024
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # defence in depth if this port is ever exposed without Caddy (Caddy sets the full set)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  client_body_timeout 60s;
  send_timeout 60s;

  location / {
    try_files $uri /index.html;
  }

  # the entry page must be revalidated, or browsers keep an old one pointing at deleted assets
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
  }

  # hashed file names (Vite: /assets/…) can be cached forever
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
  }

  location /api/ {
    # nginx accepts only 1 MB by default; backend limit is 100 MiB (+ room for multipart headers)
    client_max_body_size 101m;
    # stream uploads straight to the backend instead of buffering 100 MB in the container
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_pass http://backend:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
  }
}
