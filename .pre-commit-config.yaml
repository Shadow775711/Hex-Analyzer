# Checks before every commit: `pip install pre-commit && pre-commit install`
# Hooks are pinned to commit hashes (tags can be re-pointed); update with `pre-commit autoupdate --freeze`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b # frozen: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f368fb366ff7f2f808dd324b83a6d32267799e19 # frozen: v0.17.2
    hooks:
      - id: ruff
        args: [--fix, --config, backend/pyproject.toml]
        files: ^(backend/|\.github/scripts/)
      - id: ruff-format
        args: [--config, backend/pyproject.toml]
        files: ^(backend/|\.github/scripts/)

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/.*\.(js|jsx)$
        pass_filenames: false
      - id: no-invisible-unicode
        name: no invisible/bidirectional characters
        entry: python3 .github/scripts/check_unicode.py
        language: system
        pass_filenames: false
      - id: prettier
        name: prettier
        entry: npm --prefix frontend run format:check
        language: system
        files: ^frontend/
        pass_filenames: false
